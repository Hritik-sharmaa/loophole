# Runs the same checks you run locally on every push, so main only ever
# receives code that is formatted, lint-clean, type-safe and tested.
name: CI

# Every push to any branch (docs/ARCHITECTURE.md §4). A pull request shows
# the result of its branch's push run, so no separate pull_request trigger.
on:
  push:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # No version input: it reads "packageManager" from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile fails if package.json and pnpm-lock.yaml disagree.
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
