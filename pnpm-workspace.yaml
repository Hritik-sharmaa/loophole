packages:
  - 'apps/*'
  - 'packages/*'

# pnpm only runs install scripts for packages listed here
onlyBuiltDependencies:
  - esbuild

# reviewed and not needed
ignoredBuiltDependencies:
  - '@google/genai'
  - protobufjs
  - sharp
  - unrs-resolver

# Transitive packages held past security advisories (ADR-054): body-parser
# and multer come with Express, fast-uri with ajv.
overrides:
  body-parser: '^2.4.0'
  multer: '^2.5.0'
  fast-uri: '^3.1.9'
